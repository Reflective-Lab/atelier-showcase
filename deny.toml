# cargo-deny configuration (0.19.x)
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check  (or: just security-audit)

[advisories]
unmaintained = "workspace"
yanked = "warn"
# Ignore-list parity with foundation. Update both in lockstep when foundation
# changes. Each entry must be justified inline (transitive crate, no fix
# available, why the path is not in our exposure surface).
ignore = [
    # dotenv 0.15.0 unmaintained — transitive via axiom-truth → organism-*
    # (test/dev surface only; foundation also ignores).
    "RUSTSEC-2021-0141",
    # bincode 1.x and 2.x unmaintained. Transitive via burn (model
    # serialization) → prism-analytics. No upstream fix; burn has not
    # migrated. Mirrors prism-analytics/deny.toml.
    "RUSTSEC-2025-0141",
    # lru 0.12.5 unsound `IterMut` (Stacked Borrows). Transitive via
    # ratatui → burn-train. The unsound API is reachable only inside
    # ratatui's internal cache; we do not call it. Mirrors prism's policy.
    "RUSTSEC-2026-0002",
    # lopdf 0.38 stack overflow on deeply nested PDF objects, fix >=0.42.
    # Transitive via pdf-extract 0.10 → organism-intelligence; no fixed
    # version reachable until pdf-extract moves to lopdf >=0.42. Showcase
    # scenarios only parse repo-local sample PDFs, not untrusted input.
    # Mirrors scripts/ci/cargo-audit-blocking.sh (2026-07-02).
    "RUSTSEC-2026-0187",
    # quick-xml 0.38.4 — duplicate-attribute quadratic run time (0194) and
    # NsReader namespace-allocation DoS (0195), fixed in >=0.41. Transitive
    # via object_store 0.12.5, itself semver-locked by lancedb/surrealdb;
    # no fix path until they move. Exposure is XML from the operator-
    # configured storage provider's API, not arbitrary attacker input, and
    # both advisories are DoS-class. Added 2026-07-02.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    # NCSA permissive license (Univ. of Illinois/NCSA) — enters via
    # libfuzzer-sys (transitive: prism → burn → burn-dataset → image →
    # ravif → rav1e → libfuzzer-sys). Both foundation (converge) and
    # prism-analytics already allow it; this restores parity.
    "NCSA",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# Private/unpublished crates (proprietary + internal)
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
