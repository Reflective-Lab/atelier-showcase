[package]
name = "scenario-multi-plan-allocation"
version = "0.0.0"
edition = "2024"
publish = false

# Default build does NOT compile the OR-Tools FFI shim. Enable
# `with-solver` (which turns on `ferrox/ortools`) to actually
# solve. libortools is vendored at
# mosaic-extensions/ferrox-solvers/vendor/ortools/build and
# linked by `ferrox-ortools-sys` build.rs — no system install.
# Without the feature, the scenario exits honestly with a hint —
# no silent fallback to a heuristic.
[features]
default = []
with-solver = ["ferrox/ortools"]

[dependencies]
converge-kernel = "3.9.1"
converge-pack = "3.9.1"
ferrox = { package = "converge-ferrox-solver", path = "../../../mosaic-extensions/ferrox-solvers/crates/ferrox", version = "0.7.1", default-features = false }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
