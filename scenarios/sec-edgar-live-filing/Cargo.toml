[package]
name = "scenario-sec-edgar-live-filing"
version = "0.0.0"
edition = "2024"
publish = false
description = "REAL LIVE SEC EDGAR filing fetch and Arbiter review through Converge and Embassy"

[features]
default = []
with-solver = ["dep:ferrox", "ferrox/highs"]

[dependencies]
anyhow.workspace = true
arbiter.workspace = true
async-trait.workspace = true
atelier-domain.workspace = true
clap.workspace = true
converge-kernel.workspace = true
converge-pack.workspace = true
converge-storage.workspace = true
embassy-sec-edgar = { workspace = true, features = ["live"] }
ferrox = { workspace = true, optional = true }
prism = { package = "converge-prism-analytics", version = "2.0.1" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
