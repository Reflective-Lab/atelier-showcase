[workspace]
resolver = "2"
members = [
    "crates/atelier-domain",
    "crates/organism-domain",

    # Scenarios — full end-to-end domain demos
    "scenarios/expense-approval",
    "scenarios/arbiter-compliance",
    "scenarios/arbiter-ferrox-solver-gallery",
    "scenarios/arbiter-governance",
    "scenarios/cedar-smt-analysis",
    "scenarios/loan-application",
    "scenarios/lp-diet",
    "scenarios/meeting-scheduler",
    "scenarios/mip-facility-location",
    "scenarios/solver-policy-allocation",
    "scenarios/high-risk-claim-portfolio",
    "scenarios/jobshop-ft06",
    "scenarios/multi-plan-allocation",
    "scenarios/n-queens-cp-sat",
    "scenarios/network-flow-transport",
    "scenarios/round-driven-formation-design",
    "scenarios/sudoku-cp-sat",
    "scenarios/truth-driven-formation",
    "scenarios/vendor-selection",
    "scenarios/vrptw-comparison",

    # Tutorials — numbered learning spine (read in order)
    "tutorials/01-hello-convergence",
    "tutorials/02-custom-agent",
    "tutorials/03-custom-provider",
    "tutorials/04-intent-codec-loop",
    "tutorials/05-fixed-point-vs-budget",
    "tutorials/06-reconciliation-loop",
    "tutorials/07-adaptive-gap-loop",
    "tutorials/08-live-formation",
    "tutorials/09-formation-mixed",
    "tutorials/10-formation-compiler",
    "tutorials/11-charter-from-intent",
    "tutorials/12-shape-competition",
    "tutorials/13-topology-transition",
    "tutorials/14-debate-loop",
    "tutorials/15-resolution-showcase",
    "tutorials/16-collab-discussion",
    "tutorials/17-collab-huddle",
    "tutorials/18-collab-panel",
    "tutorials/19-collab-self-organizing",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/atelier-showcase"

[workspace.dependencies]
# Atelier internal
atelier-domain = { package = "converge-atelier-domain", path = "crates/atelier-domain" }

# Converge platform
converge-pack = "3.9.1"
converge-core = "3.9.1"
converge-kernel = "3.9.1"
converge-model = "3.9.1"
arbiter = { package = "converge-arbiter-policy", path = "../mosaic-extensions/arbiter-policy/crates/arbiter", version = "2.0.1" }
ferrox = { package = "converge-ferrox-solver", path = "../mosaic-extensions/ferrox-solvers/crates/ferrox", version = "0.7.1" }
converge-provider = "3.9.1"
converge-optimization = "3.9.1"
converge-runtime = "3.9.1"
converge-experience = "3.9.1"
converge-protocol = "3.9.1"
converge-client = "3.9.1"
converge-storage = { version = "3.9.1", default-features = false }

# Organism platform (also patched while unreleased)
organism-pack = "1.9.0"
organism-runtime = "1.9.0"
organism-intent = "1.9.0"
organism-domain = { path = "crates/organism-domain" }

# Axiom — Truth source parsing and IntentPacket compilation (patched to local).
axiom-truth = "0.8"

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Remaining release-coupling debt — axiom-truth 0.7.0 on crates.io
# imports `converge_provider::select_healthy_chat_backend`, which
# now lives in `converge-manifold-adapters` (lib name `manifold`).
# Local source is already migrated; remove this patch once
# axiom-truth is republished against the 3.9 contract.
#
# The Organism path-patches stay alongside axiom: axiom-truth
# transitively pulls local-source `organism-pack` / `-runtime` /
# `-intent` via its own path-dep workspace, so atelier's
# crates.io-resolved copies of the same crates would fork the graph
# ("multiple different versions of crate `organism_intent` in the
# dependency graph"). Patching to the same local source unifies
# them. Drop these patches in the same move that drops the
# axiom-truth patch.
#
# converge-prism-analytics — NOT patched. Local source has diverged
# past published 2.0.1 (added a `UnitFraction` newtype that
# organism-planning 1.9.1 does not yet consume); atelier resolves
# through the same crates.io 2.0.1 organism does. Re-add the patch
# when both ends move to the next prism line.
[patch.crates-io]
organism-pack = { path = "../bedrock-platform/organism/crates/pack" }
organism-runtime = { path = "../bedrock-platform/organism/crates/runtime" }
organism-intent = { path = "../bedrock-platform/organism/crates/intent" }
organism-planning = { path = "../bedrock-platform/organism/crates/planning" }
organism-adversarial = { path = "../bedrock-platform/organism/crates/adversarial" }
organism-simulation = { path = "../bedrock-platform/organism/crates/simulation" }
organism-learning = { path = "../bedrock-platform/organism/crates/learning" }
organism-catalog = { path = "../bedrock-platform/organism/crates/catalog" }
organism-catalog-seed = { path = "../bedrock-platform/organism/crates/catalog-seed" }
organism-dynamics = { path = "../bedrock-platform/organism/crates/dynamics" }
# Dropped 2026-05-19: organism-notes / organism-intelligence are not
# actually reached through the atelier dep graph (axiom-truth pulls
# pack/runtime/intent, scenarios use catalog/dynamics, etc.) and
# patching them produces an "unused patch" warning on every build.
# Re-add when something on the path actually depends on them.
axiom-truth = { path = "../bedrock-platform/axiom" }
