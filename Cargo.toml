[workspace]
resolver = "2"
members = [
    "crates/atelier-domain",
    "crates/organism-domain",
    "crates/quality-render",

    # Scenarios — full end-to-end domain demos
    "scenarios/expense-approval",
    "scenarios/arbiter-compliance",
    "scenarios/arbiter-ferrox-solver-gallery",
    "scenarios/arbiter-governance",
    "scenarios/cedar-smt-analysis",
    "scenarios/crm-helm",
    "scenarios/loan-application",
    "scenarios/lp-diet",
    "scenarios/meeting-scheduler",
    "scenarios/mip-facility-location",
    "scenarios/solver-policy-allocation",
    "scenarios/high-risk-claim-portfolio",
    "scenarios/jobshop-ft06",
    "scenarios/layered-governance",
    "scenarios/multi-plan-allocation",
    "scenarios/n-queens-cp-sat",
    "scenarios/network-flow-transport",
    "scenarios/quorum-open-inquiry",
    "scenarios/round-driven-formation-design",
    "scenarios/sec-edgar-live-filing",
    "scenarios/sudoku-cp-sat",
    "scenarios/truth-driven-formation",
    "scenarios/vendor-selection",
    "scenarios/vrptw-comparison",

    # Tutorials — numbered learning spine (read in order)
    "tutorials/01-hello-convergence",
    "tutorials/02-custom-agent",
    "tutorials/03-custom-provider",
    "tutorials/04-intent-codec-loop",
    "tutorials/05-fixed-point-vs-budget",
    "tutorials/06-reconciliation-loop",
    "tutorials/07-adaptive-gap-loop",
    "tutorials/08-live-formation",
    "tutorials/09-formation-mixed",
    "tutorials/10-formation-compiler",
    "tutorials/11-charter-from-intent",
    "tutorials/12-shape-competition",
    "tutorials/13-topology-transition",
    "tutorials/14-debate-loop",
    "tutorials/15-resolution-showcase",
    "tutorials/16-collab-discussion",
    "tutorials/17-collab-huddle",
    "tutorials/18-collab-panel",
    "tutorials/19-collab-self-organizing",
]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/atelier-showcase"

[workspace.dependencies]
# Atelier internal
atelier-domain = { package = "converge-atelier-domain", path = "crates/atelier-domain" }

# Converge platform
converge-pack = "3.9.2"
converge-core = "3.9.2"
converge-kernel = "3.9.2"
converge-model = "3.9.2"
arbiter = { package = "converge-arbiter-policy", path = "../mosaic-extensions/arbiter-policy/crates/arbiter", version = "2.0.2" }
ferrox = { package = "converge-ferrox-solver", path = "../mosaic-extensions/ferrox-solvers/crates/ferrox", version = "0.7.2" }
embassy-sec-edgar = { package = "converge-embassy-sec-edgar", path = "../mosaic-extensions/embassy-ports/crates/sec-edgar", version = "1.3.1" }
converge-provider = "3.9.2"
converge-optimization = "3.9.2"
converge-runtime = "3.9.2"
converge-experience = "3.9.2"
converge-protocol = "3.9.2"
converge-client = "3.9.2"
converge-storage = { version = "3.9.2", default-features = false }

# Organism platform (also patched while unreleased)
organism-pack = "1.9.0"
organism-runtime = "1.9.0"
organism-intent = "1.9.0"
organism-domain = { path = "crates/organism-domain" }

# Axiom — Truth source parsing and IntentPacket compilation (patched to local).
axiom-truth = "0.15.0"

# Quorum — open-inquiry scenario (path-deps; not on crates-io).
quorum-truths = { path = "../marquee-apps/quorum-sense/crates/quorum-truths" }
quorum-app    = { path = "../marquee-apps/quorum-sense/crates/quorum-app" }
quorum-domain = { path = "../marquee-apps/quorum-sense/crates/quorum-domain" }

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Remaining release-coupling debt — axiom-truth is consumed from local
# source until the 0.15 line is released against the 3.9 contract.
#
# The Organism path-patches stay alongside axiom: axiom-truth
# transitively pulls local-source `organism-pack` / `-runtime` /
# `-intent` via its own path-dep workspace, so atelier's
# crates.io-resolved copies of the same crates would fork the graph
# ("multiple different versions of crate `organism_intent` in the
# dependency graph"). Patching to the same local source unifies
# them. Drop these patches in the same move that drops the
# axiom-truth patch.
#
# converge-prism-analytics is path-patched with the rest of the stack because
# Converge 3.9's typed provenance contract changed the Suggestor trait. The
# published 2.0.1 crate still returns string provenance.

[patch.crates-io]
converge-pack         = { path = "../bedrock-platform/converge/crates/pack" }
converge-kernel       = { path = "../bedrock-platform/converge/crates/kernel" }
converge-core         = { path = "../bedrock-platform/converge/crates/core" }
converge-model        = { path = "../bedrock-platform/converge/crates/model" }
converge-optimization = { path = "../bedrock-platform/converge/crates/optimization" }
converge-runtime      = { path = "../bedrock-platform/converge/crates/runtime" }
converge-experience   = { path = "../bedrock-platform/converge/crates/experience" }
converge-provider     = { path = "../bedrock-platform/converge/crates/provider" }
organism-pack         = { path = "../bedrock-platform/organism/crates/pack" }
organism-catalog      = { path = "../bedrock-platform/organism/crates/catalog" }
organism-catalog-seed = { path = "../bedrock-platform/organism/crates/catalog-seed" }
organism-intent       = { path = "../bedrock-platform/organism/crates/intent" }
organism-planning     = { path = "../bedrock-platform/organism/crates/planning" }
organism-adversarial  = { path = "../bedrock-platform/organism/crates/adversarial" }
organism-simulation   = { path = "../bedrock-platform/organism/crates/simulation" }
organism-learning     = { path = "../bedrock-platform/organism/crates/learning" }
organism-runtime      = { path = "../bedrock-platform/organism/crates/runtime" }
organism-dynamics     = { path = "../bedrock-platform/organism/crates/dynamics" }
converge-prism-analytics = { path = "../mosaic-extensions/prism-analytics/crates/prism" }
axiom-truth              = { path = "../bedrock-platform/axiom" }
# ferrox patches unify quorum-app's transitive converge-ferrox-solver dep
# with atelier's local copy so the `links = "ortools"` constraint is met.
converge-ferrox-solver   = { path = "../mosaic-extensions/ferrox-solvers/crates/ferrox" }
converge-ferrox-ortools-sys = { path = "../mosaic-extensions/ferrox-solvers/crates/ortools-sys" }
