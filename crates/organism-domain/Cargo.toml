[package]
name = "organism-domain"
version = "1.5.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Reflective-Lab/organism"
description = "Organizational domain packs — reusable workflow patterns for autonomous organizations"

[dependencies]
async-trait = "0.1"
converge-pack = "3.8.1"
organism-pack = { path = "../../../../work/organism/crates/pack", version = "1.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
converge-kernel = "3.8.1"
tokio = { version = "1", features = ["full"] }
