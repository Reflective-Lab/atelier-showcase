[package]
name = "organism-domain"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Organizational domain packs — reusable workflow patterns for autonomous organizations"

[dependencies]
async-trait = "0.1"
converge-pack = "3.8.1"
organism-pack = { path = "../../../bedrock-platform/organism/crates/pack", version = "1.5.0" }
organism-runtime = { path = "../../../bedrock-platform/organism/crates/runtime", version = "1.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
converge-kernel = "3.8.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
