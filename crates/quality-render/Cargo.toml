[package]
name = "quality-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Reads arena-tests/reports/history.jsonl and regenerates atelier-showcase/quality/dashboard.md."

[[bin]]
name = "quality-render"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
